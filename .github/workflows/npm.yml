name: Publish to npm

# Releases are cut from tags, not from every commit pushed to main.
#
# Previously this ran on every push to main and attempted a publish each time.
# Until npm Trusted Publishing is configured for @n2flowjs/nbase that attempt
# always failed, so every ordinary code push left a red X on the repo and hid
# the fact that CI itself was green.
#
# To release: enable the trusted publisher on npm, then
#     git tag v0.2.0 && git push origin v0.2.0
# or trigger this workflow by hand from the Actions tab.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build and verify the tarball without publishing'
        type: boolean
        default: false

# Serialise publishes: two rapid pushes could both pass the "version exists?"
# check and race, with one failing on EPUBLISHCONFLICT.
concurrency:
  group: npm-publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # `id-token: write` is what makes GitHub expose the OIDC token endpoint, and
    # that endpoint is what Trusted Publishing uses to mint a short-lived,
    # workflow-scoped npm credential. It is also what `--provenance` needs for
    # its attestation. Scoped to this job so the CI job does not carry it.
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org/'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # `dist/` is gitignored, so without an explicit build the published
      # tarball's `main`/`types` point at files that do not exist.
      - name: Build
        run: npm run build

      - name: Verify the published tarball actually contains the entry points
        run: |
          set -euo pipefail
          # `npm pack --dry-run` writes its file listing to **stderr**, not
          # stdout. Redirecting stdout alone yields an empty file and every
          # check below fails on a perfectly good tarball.
          npm pack --dry-run > /tmp/pack.txt 2>&1
          test -s /tmp/pack.txt || { echo "npm pack produced no output"; exit 1; }
          grep -q 'dist/index.js' /tmp/pack.txt || { echo "dist/index.js missing from tarball"; exit 1; }
          grep -q 'dist/index.d.ts' /tmp/pack.txt || { echo "dist/index.d.ts missing from tarball"; exit 1; }
          # Guard against re-introducing the 71MB tarball (logs, tests, .env).
          if grep -qE '\.env$|daemon/.*\.log$|kB test/' /tmp/pack.txt; then
            echo "Unexpected file in tarball:"; grep -E '\.env$|daemon/.*\.log$|kB test/' /tmp/pack.txt
            exit 1
          fi
          echo "Tarball contents verified."

      - name: Test
        run: npm test

      - name: Check if version exists on npm
        id: check_version
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if npm view "@n2flowjs/nbase@$VERSION" version > /dev/null 2>&1; then
            echo "::notice::Version $VERSION is already published; nothing to do."
            echo "skip_publish=true" >> "$GITHUB_ENV"
          else
            echo "Version $VERSION is not on npm yet; proceeding."
          fi

      # `dry_run` stops after the build and tarball checks, so the release
      # pipeline can be exercised before any registry write is attempted.
      - name: Dry run complete
        if: inputs.dry_run == true
        run: |
          echo "::notice::Dry run: build, tests and tarball checks passed. No publish attempted."

      # Decide how to authenticate, and fail with an actionable message if
      # neither path is usable.
      #
      # Preferred path is Trusted Publishing (OIDC): the npm CLI detects the
      # OIDC environment and exchanges a short-lived, workflow-scoped token
      # automatically, so there is no long-lived secret to rotate. It is
      # selected when this job holds `id-token: write`, which is what makes
      # GitHub expose the token endpoint.
      #
      # The token path is the fallback. Note that `npm whoami` cannot validate
      # it under OIDC — authentication only happens during the publish itself —
      # so the check is deliberately skipped when OIDC is in play.
      - name: Check npm authentication
        if: env.skip_publish != 'true' && inputs.dry_run != true
        run: |
          set -euo pipefail

          if [ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "OIDC is available; using Trusted Publishing."
            echo "If the publish step below fails with ENEEDAUTH, npm has no trusted"
            echo "publisher registered for this package. Add one at"
            echo "https://www.npmjs.com/org/n2flowjs -> Trusted Publisher, with:"
            echo "  package:      @n2flowjs/nbase"
            echo "  workflow:     $(basename "$GITHUB_WORKFLOW")"
            echo "  filename:     $GITHUB_WORKFLOW_PATH"
            echo "  action:       npm publish"
            echo "Then re-run this workflow; no code change is needed."
            echo "auth_mode=oidc" >> "$GITHUB_ENV"
            exit 0
          fi

          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "::error::No usable npm authentication."
            echo "This job has no OIDC endpoint and NPM_TOKEN is not set."
            echo "Either enable 'id-token: write' and configure a trusted publisher at"
            echo "https://www.npmjs.com/org/n2flowjs, or add a granular access token"
            echo "(Read and write) under Settings -> Secrets and variables -> Actions."
            exit 1
          fi

          echo "Falling back to the NPM_TOKEN secret."
          if ! npm whoami; then
            echo "::error::NPM_TOKEN is set but npm rejected it (401)."
            echo "npm permanently revoked all classic tokens on 2025-12-09; this secret"
            echo "predates that and can no longer authenticate. Create a Granular Access"
            echo "Token at https://www.npmjs.com/settings/~/tokens with Read and write"
            echo "scope (max 90 days, so it needs rotation), or switch to Trusted"
            echo "Publishing to avoid a secret entirely."
            exit 1
          fi
          echo "auth_mode=token" >> "$GITHUB_ENV"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Under OIDC the credential is the short-lived token the npm CLI derives
      # from this job's OIDC token, and nothing is passed in from a secret.
      #
      # The `NODE_AUTH_TOKEN` expression matters: this repo still holds a
      # revoked classic token in NPM_TOKEN, and exporting it unconditionally
      # risks the CLI preferring a dead token over working OIDC. So the secret
      # is only surfaced when the preflight actually selected the token path.
      - name: Publish to npm
        if: env.skip_publish != 'true' && inputs.dry_run != true
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ env.auth_mode == 'token' && secrets.NPM_TOKEN || '' }}

      - name: Verify the published package
        if: env.skip_publish != 'true' && inputs.dry_run != true
        run: |
          set -euo pipefail
          echo "Published using: ${{ env.auth_mode }}"
          # The registry is eventually consistent right after a publish.
          for attempt in 1 2 3 4 5 6; do
            if npm view "@n2flowjs/nbase@${{ steps.check_version.outputs.version }}" version; then
              break
            fi
            echo "Attempt $attempt: version not visible yet, retrying..."
            sleep 10
          done
          # Consumers import `dist/index.js`; confirm it resolves from a clean install.
          mkdir -p /tmp/verify && cd /tmp/verify
          npm init -y > /dev/null
          npm install @n2flowjs/nbase --silent
          node -e "const n=require('@n2flowjs/nbase'); if(typeof n.PartitionedVectorDB!=='function') { throw new Error('PartitionedVectorDB not exported'); } console.log('published package imports OK');"
