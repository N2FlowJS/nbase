name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      prerelease:
        description: 'Publish as a trial pre-release'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  package-linux-x86_64:
    name: Build & Package (Linux x86_64)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential cmake pkg-config

      - name: Configure Release
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr/local

      - name: Build
        run: cmake --build build -j

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Package Tarball (CPack)
        run: |
          mkdir -p dist-release
          cpack --config build/CPackConfig.cmake -B dist-release
          (cd dist-release && sha256sum *.tar.gz > SHA256SUMS.txt)
          ls -lh dist-release

      - name: Verify Extracted Trial Package
        run: |
          set -euo pipefail
          mkdir -p /tmp/verify-pkg
          tar -xzf dist-release/*.tar.gz -C /tmp/verify-pkg --strip-components=1
          /tmp/verify-pkg/bin/nbase-cli version
          /tmp/verify-pkg/bin/nbased --version

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name == 'main' && 'v1.0.0-rc.1' || github.ref_name }}
          name: ${{ github.ref_name == 'main' && 'nbase v1.0.0-rc.1 (Trial)' || format('nbase {0}', github.ref_name) }}
          prerelease: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease || contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: |
            dist-release/*.tar.gz
            dist-release/SHA256SUMS.txt
