name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Release + C++17 Smoke
            build_type: Release
            flags: ''
            cpp_smoke: true
          - name: Debug + ASan + UBSan
            build_type: Debug
            flags: '-DNBASE_ENABLE_SANITIZERS=ON'
            cpp_smoke: false
          - name: Debug + TSan
            build_type: Debug
            flags: '-DNBASE_ENABLE_TSAN=ON'
            cpp_smoke: false

    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential cmake pkg-config

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} ${{ matrix.flags }}

      - name: Build
        run: cmake --build build -j

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: C++17 pkg-config Smoke
        if: matrix.cpp_smoke
        run: |
          cmake --install build --prefix /tmp/nbase-stage
          printf '#include "nbase.hpp"\nint main(){auto db=nbase::Database::create(4);return db.stats().dim==4?0:1;}\n' > /tmp/cpp_smoke.cpp
          g++ -std=c++17 -Wall -Wextra -Wpedantic -Werror /tmp/cpp_smoke.cpp \
            $(PKG_CONFIG_PATH=/tmp/nbase-stage/lib/pkgconfig pkg-config --define-prefix --cflags --libs libnbase) \
            -Wl,-rpath,/tmp/nbase-stage/lib -o /tmp/cpp_smoke
          /tmp/cpp_smoke
