name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Only one run per ref; a newer push supersedes an in-progress one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: verify (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        # Matches `engines.node` (>=20.11.0); lru-cache@11 and rimraf@6
        # require Node 20+, so the previous ">=14" claim was never true.
        node: ['20', '22', '24']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # `npm ci`, not `npm install`: honour the lockfile so CI tests exactly what
      # is published.
      - name: Install dependencies
        run: npm ci

      # Typecheck covers src + test with the full strict set
      # (noUncheckedIndexedAccess, exactOptionalPropertyTypes, ...).
      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm test
